services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-models:
    image: curlimages/curl:8.12.1
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl -s http://ollama:11434/api/tags >/dev/null; do sleep 2; done;
        curl -s http://ollama:11434/api/pull -d '{"name":"qwen3:4b","stream":false}';
        curl -s http://ollama:11434/api/pull -d '{"name":"nomic-embed-text","stream":false}'

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - BIORAG_DATA_DIR=/app/data
      - BIORAG_INDEX_DIR=/app/data/index
      - BIORAG_MODE=production
      - BIORAG_EMBEDDING_PROVIDER=${BIORAG_EMBEDDING_PROVIDER:-ollama}
      - BIORAG_OLLAMA_EMBEDDING_MODEL=${BIORAG_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - BIORAG_GENERATION_PROVIDER=${BIORAG_GENERATION_PROVIDER:-ollama}
      - BIORAG_GENERATION_MODEL=${BIORAG_GENERATION_MODEL:-qwen3:4b}
      - OLLAMA_BASE_URL=http://ollama:11434
      - BIORAG_EXTRACTION_ENGINES=docling,markitdown,pymupdf
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - BIORAG_API_URL=http://api:8000

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ollama_data:
