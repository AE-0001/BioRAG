[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biorag"
version = "0.1.0"
description = "Evidence-grounded multimodal retrieval for biomedical literature"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gayathri Nandhana Mohan" }]
dependencies = [
  "fastapi>=0.111,<1",
  "docling>=2.50,<3",
  "faiss-cpu>=1.8,<2",
  "google-genai>=1.0,<2",
  "langchain>=1.0,<2",
  "langchain-community>=0.4,<1",
  "langgraph>=1.0,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10.3,<12",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.24,<2",
  "paddleocr>=3.0,<4",
  "paddlepaddle>=3.0,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36,<2", "requests>=2.32,<3", "plotly>=5.22,<7"]
dev = ["pytest>=8.2,<10", "pytest-cov>=6,<8", "httpx>=0.27,<1", "ruff>=0.5,<1"]

[project.scripts]
biorag = "biorag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=biorag --cov-report=term-missing --cov-fail-under=79"

[tool.ruff]
line-length = 100
target-version = "py311"
